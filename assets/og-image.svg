<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="prefixer: scoped codebase search for AI agents">
  <!-- square canvas for thumbnail renderers; the live card is the
       central 1200x630 band (y 285-915); crop there for og:image -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10161f"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34e0c0"/>
      <stop offset="1" stop-color="#2bb3ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect x="40" y="325" width="1120" height="550" rx="40" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="585" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="150" font-weight="700" letter-spacing="2"><tspan fill="url(#acc)">Prefix</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#7d8a97">er</tspan></text>
  <text x="600" y="665" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="400" letter-spacing="8" fill="#9aa7b4">SCOPED CODE SEARCH FOR AI AGENTS</text>
  <text x="600" y="755" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#2dd4bf">79% fewer search bytes, measured on 18 public repos</text>
  <text x="600" y="805" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8b949e">markdown + shell · works with Devin, Claude Code, Codex, Cursor</text>
</svg>
