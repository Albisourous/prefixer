<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#aab4be"/>
    </marker>
    <style>
      text { fill: #aab4be; } .t { fill: #e6edf3; } .hi { fill: #2dd4bf; font-weight: 700; }
      .box { fill: none; stroke: #6e7681; stroke-width: 1.5; }
      .flow { stroke: #aab4be; stroke-width: 1.5; fill: none; }
      .hit { stroke: #2dd4bf; }
    </style>
  </defs>

  <rect class="box" x="250" y="8" width="220" height="30" rx="15"/>
  <text class="t" x="360" y="28" text-anchor="middle" font-size="12">query "session token"</text>
  <line class="flow" x1="360" y1="38" x2="360" y2="50" marker-end="url(#ah)"/>

  <rect class="box" x="190" y="56" width="340" height="84" rx="8"/>
  <text x="206" y="74" font-size="11">.prefixer/namespaces.md</text>
  <text class="t" x="206" y="92" font-size="12"><tspan class="hi">auth:</tspan>  src/auth/**      login, tokens</text>
  <text class="t" x="206" y="110" font-size="12"><tspan class="hi">pay:</tspan>   src/payments/**  checkout</text>
  <text x="206" y="128" font-size="11">nested rows · repo: qualifier · derived names</text>
  <line class="flow" x1="360" y1="140" x2="360" y2="152" marker-end="url(#ah)"/>
  <text x="372" y="150" font-size="10">"session" matches auth:</text>

  <rect class="box" x="190" y="158" width="340" height="34" rx="8"/>
  <text class="t" x="360" y="179" text-anchor="middle" font-size="12">rg "session token" src/auth/</text>

  <line class="flow" x1="300" y1="192" x2="240" y2="216" marker-end="url(#ah)"/>
  <line class="flow" x1="420" y1="192" x2="480" y2="216" marker-end="url(#ah)"/>
  <text x="252" y="210" font-size="10">hit</text>
  <text x="468" y="210" font-size="10" text-anchor="end">miss</text>

  <rect class="box hit" x="90" y="222" width="240" height="56" rx="8"/>
  <text class="t" x="210" y="244" text-anchor="middle" font-size="12">12 hits · 3 KB</text>
  <text x="210" y="262" text-anchor="middle" font-size="10">answer, no root scan</text>

  <rect class="box" x="390" y="222" width="240" height="56" rx="8"/>
  <text class="t" x="510" y="244" text-anchor="middle" font-size="12">widen one level</text>
  <text x="510" y="262" text-anchor="middle" font-size="10">namespace → parent → root</text>
</svg>
