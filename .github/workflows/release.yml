name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-package.py
      - run: bash scripts/test_scaffold.sh
      - name: syntax-check every script
        run: |
          shopt -s nullglob
          for s in scripts/*.sh eval/*.sh eval/agent/*.sh eval/agent/adapters/*.sh; do bash -n "$s" || exit 1; done
          python3 -m py_compile scripts/*.py eval/agent/*.py
      - name: Check tag matches SKILL.md version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          stamped="$(sed -n 's/^  version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' SKILL.md | head -1)"
          [ "$tagged" = "$stamped" ] || {
            echo "tag $GITHUB_REF_NAME != SKILL.md version $stamped"
            exit 1
          }
      - name: Extract release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG section for $v"; exit 1; }
          if grep -q "TODO" notes.md; then
            echo "CHANGELOG notes still say TODO"; exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
